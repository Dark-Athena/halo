version: "3.1"
services:
  halo:
    # 使用本地 Dockerfile.build 从源码构建（包含 YashanDB 适配），
    # 首次启动前请确保 Docker BuildKit 已启用（Docker 23+ 默认开启）。
    # 构建命令：docker compose -f docker-compose-yashandb.yaml build
    build:
      context: .
      dockerfile: Dockerfile.build
    container_name: halo
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 180s
    volumes:
      - ./halo2:/root/.halo2
    ports:
      - 8090:8090
    command:
      # YashanDB R2DBC 连接地址，格式：r2dbc:pool:yashandb://<host>:<port>/
      - --spring.r2dbc.url=r2dbc:pool:yashandb://yashandb:1688/
      # YashanDB 用户名，默认使用 sys
      - --spring.r2dbc.username=sys
      # YashanDB 密码，请保证与下方 SYS_PASSWD 的变量值一致
      - --spring.r2dbc.password=${YASHANDB_SYS_PASSWD:-Enmo_123}
      - --spring.sql.init.platform=yashandb
      - --spring.sql.init.mode=always
      - --spring.sql.init.continue-on-error=true
      # YashanDB 兼容 MySQL SQL 语法，因此迁移方言使用 mysql
      - --r2dbc.migrate.dialect=mysql
      # YashanDB 已处于健康状态（依赖 depends_on），无需再等待数据库就绪
      - --r2dbc.migrate.wait-for-database=false
      # 外部访问地址，请根据实际需要修改
      # - --halo.external-url=http://localhost:8090/
    depends_on:
      yashandb:
        condition: service_healthy
  yashandb:
    image: yasdb/yashandb:${YASHANDB_VERSION:-23.4.7.100}
    container_name: yashandb
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1688' 2>/dev/null && echo OK || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    volumes:
      - ./yashandb-data:/home/yashan/yashandb
    environment:
      - SYS_PASSWD=${YASHANDB_SYS_PASSWD:-Enmo_123}
    ports:
      - 1688:1688
